<script>
'use strict';
// Persistence and game state. Storage failure never prevents offline play.
const $=id=>document.getElementById(id), TOTAL=1000, COLORS=['#acb7ff','#91ddd4','#f5b58c','#e6a3ce','#c5dd8b','#8fc9f3','#f0d28a'];
let saved;try{saved=JSON.parse(localStorage.getItem('arrow-escape-v1'))}catch{}saved=Object.assign({unlocked:1,stars:{},daily:{},sound:true,haptics:true,theme:'light',colors:false},saved||{});
function persist(){try{localStorage.setItem('arrow-escape-v1',JSON.stringify(saved))}catch{}}
// Apply the requested new appearance once; retain all progress and stars.
if(saved.designVersion!==2){saved.designVersion=2;saved.theme='light';saved.colors=false;saved.arrowSize='compact';persist()}
function theme(){document.body.classList.toggle('classic',!saved.colors);document.body.classList.toggle('light',saved.theme==='light');document.querySelector('meta[name="theme-color"]').content=saved.theme==='light'?'#ffffff':'#111827'}theme();
let game,particles=[],lastTime=0,view={zoom:1,x:0,y:0},W=0,H=0,cell=0,baseX=0,baseY=0;
const canvas=$('canvas'),ctx=canvas.getContext('2d'),dirs=[[0,-1],[1,0],[0,1],[-1,0]],key=(x,y)=>x+','+y;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
// Solver: only OTHER pieces can obstruct the ray ahead of a head.
function free(piece,pieces,n){const occupied=new Set();for(const p of pieces)if(p.id!==piece.id&&!p.removed&&!p.slide)for(const c of p.cells)occupied.add(key(...c));const head=piece.cells.at(-1),d=dirs[piece.dir];for(let x=head[0]+d[0],y=head[1]+d[1];x>=0&&y>=0&&x<n&&y<n;x+=d[0],y+=d[1])if(occupied.has(key(x,y)))return false;return true}
// Validator shares no placement assumptions: remove only pieces with clear rays.
function solve(pieces,n){
 const occupied=new Map(),left=new Map(pieces.map(p=>[p.id,p])),order=[];
 for(const p of pieces)for(const c of p.cells)occupied.set(key(...c),p.id);
 while(left.size){let progress=false;
  for(const p of [...left.values()].reverse()){
   const h=p.cells.at(-1),d=dirs[p.dir];let clear=true;
   for(let x=h[0]+d[0],y=h[1]+d[1];x>=0&&y>=0&&x<n&&y<n;x+=d[0],y+=d[1]){const owner=occupied.get(key(x,y));if(owner!==undefined&&owner!==p.id){clear=false;break}}
   if(clear){left.delete(p.id);for(const c of p.cells)occupied.delete(key(...c));order.push(p.id);progress=true}
  }
  if(!progress)return null;
 }
 return order;
}
const TIERS=[
 {name:'Easy',min:25,max:40,color:'#357b62'},
 {name:'Medium',min:50,max:75,color:'#3779ad'},
 {name:'Hard',min:100,max:150,color:'#a47128'},
 {name:'Very Hard',min:150,max:200,color:'#c26542'},
 {name:'Nightmare',min:200,max:250,color:'#a44e85'},
 {name:'Extreme Nightmare',min:300,max:400,color:'#9551c5'}
];
function levelSpec(level,seed){
 // Tier shuffling is stable across devices. Later levels trend toward each
 // tier's upper bound, while seeded jitter varies count and spatial density.
 const tierIndex=hash('difficulty-v2-'+level)%TIERS.length,tier=TIERS[tierIndex],r=rng(seed^0x51f);
 const progress=Math.max(0,Math.min(1,(level-1)/149));
 const fraction=Math.max(0,Math.min(1,progress+(r()-.5)*.3));
 const count=tier.min+Math.round((tier.max-tier.min)*fraction);
 return{tierIndex,tier,count,spacing:1.05+r()*.35};
}
// Dense reverse construction. Partition a portrait rectangle into row bands,
// then tile each band with connected snakes. Every cell belongs to a piece.
// Visit each band from its far edge toward its escape edge, so a horizontal
// escape is always available. Other directions are chosen whenever clear.
function generate(level,seed){
 const spec=levelSpec(level,seed),random=rng(seed),pieces=[],occupied=new Set();
 const rows=Math.max(3,Math.round(Math.sqrt(spec.count*(2.4+random()*.8))));
 const columns=Math.ceil(spec.count/rows),width=columns*(3+Math.floor(random()*2));
 const bands=[];let height=0,remaining=spec.count;
 for(let row=0;row<rows;row++){
  const count=Math.ceil(remaining/(rows-row)),h=row%4===0?1:2+Math.floor(random()*4);
  bands.push({y:height,h,count,left:random()<.5});height+=h;remaining-=count;
 }
 const n=Math.max(width,height);
 function path(x,y,w,h,dir,flip){
  const vertical=dir===0||dir===2,ww=vertical?h:w,hh=vertical?w:h;
  const left=dir===3||dir===0,headFirst=[];
  for(let row=0;row<hh;row++)for(let col=0;col<ww;col++){
   const u=(row%2===0?left:!left)?col:ww-1-col,v=flip?hh-1-row:row;
   headFirst.push(vertical?[x+v,y+u]:[x+u,y+v]);
  }
  return headFirst.reverse();
 }
 // Band order is shuffled; each band's reserved rows remain independent.
 for(let i=bands.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[bands[i],bands[j]]=[bands[j],bands[i]]}
 for(const band of bands){
  const widths=Array(band.count).fill(2);let spare=width-band.count*2;
  while(spare-->0)widths[Math.floor(random()*widths.length)]++;
  const tiles=[];let x=0;for(const w of widths){tiles.push({x,w});x+=w}
  if(band.left)tiles.reverse();
  for(let ti=0;ti<tiles.length;ti++){
   const tile=tiles[ti];
   // Paired tiles can become an L-shaped arrow plus a simple interior path.
   // Both heads point toward the band's known-clear escape edge.
   if(band.h>=2&&ti+1<tiles.length&&random()<.35){
    const next=tiles[++ti],x=Math.min(tile.x,next.x),w=tile.w+next.w,dir=band.left?3:1;
    const far=band.left?x+w-1:x,edge=band.left?x:x+w-1,cells=[];
    for(let y=band.y+band.h-1;y>=band.y;y--)cells.push([far,y]);
    for(let xx=far+(band.left?-1:1);band.left?xx>=edge:xx<=edge;xx+=band.left?-1:1)cells.push([xx,band.y]);
    const inner=path(band.left?x:x+1,band.y+1,w-1,band.h-1,dir,false);
    for(const body of [cells,inner]){
     const piece={id:pieces.length,cells:body,dir,color:COLORS[pieces.length%COLORS.length],removed:false,slide:0,shake:0};
     pieces.push(piece);for(const c of body)occupied.add(key(...c));
    }
    continue;
   }
   const options=[];
   for(let dir=0;dir<4;dir++)for(const flip of [false,true]){
    const cells=path(tile.x,band.y,tile.w,band.h,dir,flip),head=cells.at(-1),neck=cells.at(-2),d=dirs[dir];if(!neck||head[0]-neck[0]!==d[0]||head[1]-neck[1]!==d[1])continue;let clear=true;
    for(let xx=head[0]+d[0],yy=head[1]+d[1];xx>=0&&yy>=0&&xx<n&&yy<n;xx+=d[0],yy+=d[1])if(occupied.has(key(xx,yy))){clear=false;break}
    if(clear)options.push({cells,dir});
   }
   if(!options.length)throw Error('Dense placement invariant failed');
   const chosen=options[Math.floor(random()*options.length)];
   // Backbite the tail to vary bends while preserving a full, connected tile
   // and the head/neck direction. This avoids repeating identical row snakes.
   const route=[...chosen.cells].reverse();
   for(let attempt=0;attempt<route.length*4;attempt++){
    const tail=route.at(-1),d=dirs[Math.floor(random()*4)];
    const at=route.findIndex(c=>c[0]===tail[0]+d[0]&&c[1]===tail[1]+d[1]);
    if(at>=1&&at<route.length-2){const suffix=route.splice(at+1).reverse();route.push(...suffix)}
   }
   chosen.cells=route.reverse();
   const piece={id:pieces.length,...chosen,color:COLORS[pieces.length%COLORS.length],removed:false,slide:0,shake:0};
   pieces.push(piece);for(const c of piece.cells)occupied.add(key(...c));
  }
 }
 if(pieces.length!==spec.count||!solve(pieces,n))throw Error('Level validation failed');
 return{n,width,height,pieces,...spec};
}
function dailyDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function start(level=1,daily=false){const date=dailyDate(),data=generate(daily?1+hash(date)%TOTAL:level,hash(daily?'daily-'+date:'arrow-v1-'+level));game={...data,level,daily,date,hearts:3,hints:3,undos:3,history:[],showPaths:false,guideCache:null,status:'playing',hintId:null,hintUntil:0,total:data.pieces.length};particles=[];view={zoom:1,x:0,y:0};$('overlay').hidden=true;toggleMenu(false);resize();ui()}
function ui(){$('paths').setAttribute('aria-pressed',String(game.showPaths));$('paths').setAttribute('aria-label',game.showPaths?'Hide arrow paths':'Show arrow paths');const left=game.pieces.filter(p=>!p.removed&&!p.slide).length;$('levelTitle').textContent=game.daily?'Daily escape':'Level '+String(game.level).padStart(2,'0');$('chapter').textContent=game.tier.name;$('hearts').innerHTML=Array.from({length:3},(_,i)=>'<span class="'+(i>=game.hearts?'spent':'')+'">♥</span>').join('');$('hearts').setAttribute('aria-label',game.hearts+' hearts');$('remaining').textContent=left+' / '+game.total+' ARROWS';$('progress').style.width=(100*(1-left/game.total))+'%';$('hintCount').textContent='/ '+game.hints;$('undoCount').textContent='/ '+game.undos;$('undo').disabled=!game.history.length||!game.undos;$('hint').disabled=!game.hints||game.status!=='playing'||!left;}
// Synthesized audio, unlocked only by a user gesture.
let audio;function sound(type){if(!saved.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=type==='win'?[523,659,784,1047]:type==='error'?[105,80]:type==='whoosh'?[650,320,160]:[480];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.08;o.type=type==='error'?'triangle':'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.65,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.24)})}catch{}}
function vibrate(pattern){if(!saved.haptics)return;if(navigator.vibrate)navigator.vibrate(pattern);else if(window.webkit?.messageHandlers?.haptics)window.webkit.messageHandlers.haptics.postMessage(pattern.length>2?'error':'success')}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
// Escapes reserve their removal immediately; animation never locks input.
function tap(piece){if(!$('playMenu').hidden)return;if(!piece||piece.removed||piece.slide||game.status!=='playing'||!$('overlay').hidden)return;game.showPaths=false;game.guideCache=null;sound('tap');game.hintId=null;if(!free(piece,game.pieces,game.n)){game.history.push({type:'block',id:piece.id,hearts:game.hearts});game.hearts--;piece.shake=.42;sound('error');vibrate([45,25,45]);if(!game.hearts){game.status='failed';const failedGame=game;setTimeout(()=>{if(game===failedGame&&game.status==='failed')result(false)},480)}else toast('That way is blocked. Try another arrow.');ui();return}game.history.push({type:'escape',id:piece.id,hearts:game.hearts});piece.slide=.001;sound('whoosh');ui()}
function undo(){toggleMenu(false);if(!game.undos||!game.history.length)return;const move=game.history.pop(),p=game.pieces.find(p=>p.id===move.id);p.removed=false;p.slide=0;p.shake=0;game.hearts=move.hearts;game.undos--;game.status='playing';game.hintId=null;$('overlay').hidden=true;ui();sound('tap')}
function hint(){toggleMenu(false);if(game.status!=='playing'||!game.hints)return;const p=game.pieces.find(p=>!p.removed&&!p.slide&&free(p,game.pieces,game.n));if(p){game.hints--;game.hintId=p.id;game.hintUntil=performance.now()+6000;view.zoom=Math.max(view.zoom,Math.min(14,24/cell));const h=screen(p.cells.at(-1));view.x=-(h[0]-W/2)*view.zoom;view.y=-(h[1]-H/2)*view.zoom;clampPan();toast('The glowing arrow has a clear way out.');sound('tap');ui()}}
function toggleMenu(open){$('playMenu').hidden=!open;$('menuToggle').setAttribute('aria-expanded',String(open))}
$('menuToggle').onclick=()=>toggleMenu($('playMenu').hidden);$('closeMenu').onclick=()=>toggleMenu(false);
function modal(html){toggleMenu(false);$('card').innerHTML=html;$('overlay').hidden=false}
function result(win){if(win){const k=game.daily?game.date:game.level,store=game.daily?saved.daily:saved.stars;store[k]=Math.max(store[k]||0,game.hearts);if(!game.daily)saved.unlocked=Math.max(saved.unlocked,Math.min(TOTAL,game.level+1));persist();sound('win');vibrate([45,60,90]);for(let i=0;i<90;i++)particles.push({x:Math.random()*W,y:-Math.random()*H,vx:(Math.random()-.5)*180,vy:80+Math.random()*160,life:3,max:3,color:COLORS[i%7],confetti:true})}
modal('<span class="eyebrow">'+(win?'BEAUTIFULLY UNTANGLED':'TAKE A BREATH')+'</span><h2>'+(win?'Room to move.':'A fresh perspective?')+'</h2><div class="stars">'+(win?'★'.repeat(game.hearts)+'☆'.repeat(3-game.hearts):'♡ ♡ ♡')+'</div><p>'+(win?'Every arrow found its way. So did you.':'You ran out of hearts. Restart the puzzle or undo your last move.')+'</p><button class="primary" id="resultPrimary">'+(win?(game.daily?'Back to levels':game.level===TOTAL?'Play again':'Next level →'):'Try again')+'</button>'+(!win&&game.undos&&game.history.length?'<button class="secondary" id="resultUndo">Undo last move ('+game.undos+' left)</button>':'')+'<button class="secondary" id="resultLevels">Choose a level</button>');$('resultPrimary').onclick=()=>win?(game.daily?levels():start(game.level===TOTAL?1:game.level+1)):start(game.level,game.daily);if($('resultUndo'))$('resultUndo').onclick=undo;$('resultLevels').onclick=levels}
function settings(){modal('<span class="eyebrow">MAKE YOURSELF AT HOME</span><h2>Settings</h2>'+['sound','haptics','theme','colors','arrowSize'].map(k=>'<div class="row"><span>'+(k==='arrowSize'?'Arrow size':k[0].toUpperCase()+k.slice(1))+'</span><button id="set-'+k+'">'+(k==='theme'||k==='arrowSize'?saved[k]:(saved[k]?'On':'Off'))+'</button></div>').join('')+'<p style="margin-top:20px">Tap an arrow to send it forward. Its head needs a clear line to the edge. Clear the board with as many hearts as you can.</p><button class="primary" id="closeSettings">Back to puzzle</button>');for(const k of ['sound','haptics','theme','colors','arrowSize'])$('set-'+k).onclick=()=>{saved[k]=k==='arrowSize'?({compact:'balanced',balanced:'large',large:'compact'}[saved[k]]||'compact'):k==='theme'?(saved[k]==='dark'?'light':'dark'):!saved[k];persist();theme();settings()};$('closeSettings').onclick=()=>$('overlay').hidden=true}
function levels(){modal('<span class="eyebrow">1,000 MOMENTS OF CLARITY</span><h2>Choose your escape</h2><p>Earn stars. Find a little more space.</p><button class="secondary" id="levelDaily">◷ Daily challenge · '+dailyDate()+'</button><div class="levels">'+Array.from({length:TOTAL},(_,i)=>{const l=i+1;return'<button class="level" data-level="'+l+'" '+(l>saved.unlocked?'disabled':'')+' aria-label="Level '+l+'">'+(l>saved.unlocked?'⌑':l)+'<small>'+(l<=saved.unlocked?TIERS[hash('difficulty-v2-'+l)%6].name:'')+'<br>'+'★'.repeat(saved.stars[l]||0)+'</small></button>'}).join('')+'</div><button class="primary" id="closeLevels">Back to puzzle</button>');$('card').querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));$('levelDaily').onclick=()=>start(75,true);$('closeLevels').onclick=()=>$('overlay').hidden=true}
// Renderer: path sampling makes every body segment follow the original bends.
// Fit the original occupied bounds; zoom controls live outside the canvas. Do not refit as pieces leave: the board must remain stable to tap.
function puzzleBounds(){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const p of game.pieces)for(const [x,y] of p.cells){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}return{minX,minY,width:maxX-minX+1,height:maxY-minY+1}}
function resize(){const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;const dpr=Math.min(3,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(game){const bounds=puzzleBounds(),availableH=Math.max(40,H-16);cell=Math.min((W-24)/bounds.width,availableH/bounds.height);baseX=(W-cell*bounds.width)/2-bounds.minX*cell;baseY=(availableH-cell*bounds.height)/2-bounds.minY*cell+8;clampPan()}}
new ResizeObserver(resize).observe(canvas);
function pointAt(p,t){const count=p.cells.length-1;if(t>=count){const h=p.cells[count],d=dirs[p.dir];return[h[0]+d[0]*(t-count),h[1]+d[1]*(t-count)]}const i=Math.max(0,Math.floor(t)),f=t-i,a=p.cells[i],b=p.cells[Math.min(i+1,count)];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
// Keep arrowheads readable in overview and proportional when zoomed in.
function arrowHeadSize(){const preset={compact:[.30,3.2],balanced:[.38,4.8],large:[.5,7]}[saved.arrowSize]||[.30,3.2];return Math.max(cell*preset[0],preset[1]/view.zoom)}
function screen(c){return[baseX+(c[0]+.5)*cell,baseY+(c[1]+.5)*cell]}
// The optional guide layer uses the actual occupied rectangle, never the
// larger solver grid. Cache geometry; zoom and pan share the canvas transform.
function drawPathGuides(){
 if(!game.showPaths)return;
 const cacheKey=[W,H,cell,baseX,baseY].join(',');
 if(!game.guideCache||game.guideCache.key!==cacheKey){
  const bounds=puzzleBounds(),grid=new Path2D(),rays=new Path2D(),r=Math.max(.5,cell*.055);
  for(let y=bounds.minY;y<bounds.minY+bounds.height;y++)for(let x=bounds.minX;x<bounds.minX+bounds.width;x++){
   const p=screen([x,y]);grid.moveTo(p[0]+r,p[1]);grid.arc(p[0],p[1],r,0,Math.PI*2);
  }
  for(const p of game.pieces)if(!p.removed&&!p.slide){
   const head=p.cells.at(-1),d=dirs[p.dir],end=[...head];
   if(d[0])end[0]=d[0]>0?bounds.minX+bounds.width-.5:bounds.minX-.5;
   if(d[1])end[1]=d[1]>0?bounds.minY+bounds.height-.5:bounds.minY-.5;
   rays.moveTo(...screen(head));rays.lineTo(...screen(end));
  }
  game.guideCache={key:cacheKey,grid,rays};
 }
 ctx.save();ctx.fillStyle=saved.theme==='light'?'#a5accd':'#70829e';ctx.globalAlpha=.5;ctx.fill(game.guideCache.grid);
 ctx.strokeStyle=saved.theme==='light'?'#7f89bb':'#a1b6db';ctx.globalAlpha=.35;ctx.lineWidth=1/view.zoom;ctx.setLineDash([2/view.zoom,4/view.zoom]);ctx.stroke(game.guideCache.rays);ctx.restore();
}
function frame(now){const dt=Math.min(.04,(now-lastTime)/1000||.016);lastTime=now;ctx.clearRect(0,0,W,H);if(game){ctx.save();ctx.translate(W/2+view.x,H/2+view.y);ctx.scale(view.zoom,view.zoom);ctx.translate(-W/2,-H/2);drawPathGuides();ctx.fillStyle=saved.theme==='dark'?'#344154':'#dbe1d6';
const heads=[];let finished=false;for(const p of game.pieces){if(p.removed)continue;if(p.shake>0)p.shake=Math.max(0,p.shake-dt);if(p.slide>0){p.slide+=dt*(12+game.n*1.1);if(p.slide>game.n+p.cells.length+2){p.removed=true;p.slide=0;finished=true;continue}const h=screen(pointAt(p,p.cells.length-1+p.slide));for(let j=0;j<1&&particles.length<300;j++)particles.push({x:(h[0]-W/2)*view.zoom+W/2+view.x,y:(h[1]-H/2)*view.zoom+H/2+view.y,vx:(Math.random()-.5)*45,vy:(Math.random()-.5)*45,life:.45,max:.45,color:p.color})}
ctx.save();if(p.shake)ctx.translate(Math.sin(p.shake*90)*cell*.12,0);const highlight=p.id===game.hintId&&now<game.hintUntil;ctx.strokeStyle=p.shake?'#ff627c':highlight?'#63bfa3':saved.colors?p.color:(saved.theme==='light'?'#10112d':'#e4eaf1');ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=Math.max(.75/view.zoom,cell*.105);ctx.lineCap='round';ctx.lineJoin='round';if(highlight){ctx.shadowColor='#63bfa3';ctx.shadowBlur=15+Math.sin(now/120)*5;ctx.lineWidth*=1.25}const end=p.cells.length-1+p.slide;ctx.beginPath();const tail=screen(pointAt(p,p.slide));ctx.moveTo(...tail);for(let t=Math.floor(p.slide)+1;t<end;t++)ctx.lineTo(...screen(pointAt(p,t)));const head=screen(pointAt(p,end));ctx.lineTo(...head);ctx.stroke();heads.push({head:[head[0]+(p.shake?Math.sin(p.shake*90)*cell*.12:0),head[1]],dir:p.dir,size:arrowHeadSize(),color:ctx.fillStyle});ctx.restore()}
// Heads go last so neighboring bodies cannot paint over their tips.
for(const arrow of heads){const d=dirs[arrow.dir],head=arrow.head,size=arrow.size;ctx.fillStyle=arrow.color;ctx.beginPath();ctx.moveTo(head[0]-d[0]*size-d[1]*size*.55,head[1]-d[1]*size+d[0]*size*.55);ctx.lineTo(head[0]+d[0]*size*.2,head[1]+d[1]*size*.2);ctx.lineTo(head[0]-d[0]*size+d[1]*size*.55,head[1]-d[1]*size-d[0]*size*.55);ctx.closePath();ctx.fill()}
ctx.restore();if(finished){ui();if(game.status==='playing'&&game.pieces.every(q=>q.removed)){game.status='won';result(true)}}}
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.confetti)p.vy+=80*dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.confetti?5:3,p.confetti?9:3)}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(frame)}
// Input: forgiving nearest-path selection; pointer gestures separate taps/pans.
// Suppress selection, image dragging and long-press menus inside the game.
for(const event of ['selectstart','dragstart','contextmenu'])document.querySelector('.app').addEventListener(event,e=>e.preventDefault());
const pointers=new Map();let gesture=null;
function distanceToSegment(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hit(x,y){const p=[(x-W/2-view.x)/view.zoom+W/2,(y-H/2-view.y)/view.zoom+H/2];let best=null,dist=Infinity;for(const a of game.pieces)if(!a.removed&&!a.slide)for(let i=1;i<a.cells.length;i++){const d=distanceToSegment(p,screen(a.cells[i-1]),screen(a.cells[i]));if(d<dist){dist=d;best=a}}if(dist<=Math.max(cell*.42,14/view.zoom))tap(best)}
function coords(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function pinchData(){const [a,b]=[...pointers.values()];return{distance:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function clampPan(){view.x=Math.max(-W*(view.zoom-1)/2-30,Math.min(W*(view.zoom-1)/2+30,view.x));view.y=Math.max(-H*(view.zoom-1)/2-30,Math.min(H*(view.zoom-1)/2+30,view.y));if(view.zoom===1)view.x=view.y=0}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,coords(e));if(pointers.size===1)gesture={...coords(e),last:coords(e),moved:false,multi:false};if(pointers.size===2){gesture.multi=true;gesture.pinch=pinchData();gesture.zoom=view.zoom;gesture.vx=view.x;gesture.vy=view.y}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;const p=coords(e);pointers.set(e.pointerId,p);if(pointers.size===2){const q=pinchData(),g=gesture.pinch;if(!g)return;view.zoom=Math.max(1,Math.min(14,gesture.zoom*q.distance/Math.max(1,g.distance)));const ratio=view.zoom/gesture.zoom;view.x=q.x-W/2-(g.x-W/2-gesture.vx)*ratio;view.y=q.y-H/2-(g.y-H/2-gesture.vy)*ratio;clampPan()}else{if(Math.hypot(p.x-gesture.x,p.y-gesture.y)>8)gesture.moved=true;if(gesture.moved&&view.zoom>1){view.x+=p.x-gesture.last.x;view.y+=p.y-gesture.last.y;clampPan()}gesture.last=p}});
function endPointer(e,cancel=false){if(!pointers.has(e.pointerId))return;const p=coords(e);pointers.delete(e.pointerId);if(!cancel&&gesture&&!gesture.moved&&!gesture.multi&&pointers.size===0)hit(p.x,p.y);if(!pointers.size)gesture=null;else if(gesture)gesture.last=[...pointers.values()][0]}
canvas.addEventListener('pointerup',e=>endPointer(e));canvas.addEventListener('pointercancel',e=>endPointer(e,true));canvas.addEventListener('wheel',e=>{e.preventDefault();view.zoom=Math.max(1,Math.min(14,view.zoom-e.deltaY*.003));clampPan()},{passive:false});
$('paths').onclick=()=>{game.showPaths=!game.showPaths;game.guideCache=null;ui()};$('zoomIn').onclick=()=>{view.zoom=Math.min(14,Math.max(view.zoom*1.5,18/cell));clampPan()};$('zoomOut').onclick=()=>{view.zoom=Math.max(1,view.zoom/1.5);clampPan()};$('zoomFit').onclick=()=>{view={zoom:1,x:0,y:0}};$('hint').onclick=hint;$('undo').onclick=undo;$('restart').onclick=()=>{modal('<h2>A clean slate?</h2><p>Restart this puzzle with three hearts. Your hints and undos will reset.</p><button class="primary" id="confirmRestart">Restart level</button><button class="secondary" id="cancelRestart">Keep playing</button>');$('confirmRestart').onclick=()=>start(game.level,game.daily);$('cancelRestart').onclick=()=>$('overlay').hidden=true};$('settings').onclick=settings;$('select').onclick=levels;$('daily').onclick=()=>start(75,true);

window.ArrowEscape={generate,solve,free,levelSpec,TIERS,get state(){return game},start};start(Math.min(TOTAL,saved.unlocked));requestAnimationFrame(frame);
