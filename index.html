<script>
'use strict';
// Persistence and game state. Storage failure never prevents offline play.
const $=id=>document.getElementById(id), TOTAL=1000, COLORS=['#acb7ff','#91ddd4','#f5b58c','#e6a3ce','#c5dd8b','#8fc9f3','#f0d28a'];
let saved;try{saved=JSON.parse(localStorage.getItem('arrow-escape-v1'))}catch{}saved=Object.assign({unlocked:1,stars:{},daily:{},sound:true,haptics:true,theme:'light',colors:false},saved||{});
function persist(){try{localStorage.setItem('arrow-escape-v1',JSON.stringify(saved))}catch{}}
function theme(){document.body.classList.toggle('classic',!saved.colors);document.body.classList.toggle('light',saved.theme==='light');document.querySelector('meta[name="theme-color"]').content=saved.theme==='light'?'#f4f5ef':'#111827'}theme();
let game,particles=[],lastTime=0,view={zoom:1,x:0,y:0},W=0,H=0,cell=0,baseX=0,baseY=0;
const canvas=$('canvas'),ctx=canvas.getContext('2d'),dirs=[[0,-1],[1,0],[0,1],[-1,0]],key=(x,y)=>x+','+y;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// Solver: only OTHER pieces can obstruct the ray ahead of a head.
function free(piece,pieces,n){const occupied=new Set();for(const p of pieces)if(p.id!==piece.id&&!p.removed&&!p.slide)for(const c of p.cells)occupied.add(key(...c));const head=piece.cells.at(-1),d=dirs[piece.dir];for(let x=head[0]+d[0],y=head[1]+d[1];x>=0&&y>=0&&x<n&&y<n;x+=d[0],y+=d[1])if(occupied.has(key(x,y)))return false;return true}
// Validator shares no placement assumptions: remove only pieces with clear rays.
function solve(pieces,n){
 const occupied=new Map(),left=new Map(pieces.map(p=>[p.id,p])),order=[];
 for(const p of pieces)for(const c of p.cells)occupied.set(key(...c),p.id);
 while(left.size){let progress=false;
  for(const p of [...left.values()].reverse()){
   const h=p.cells.at(-1),d=dirs[p.dir];let clear=true;
   for(let x=h[0]+d[0],y=h[1]+d[1];x>=0&&y>=0&&x<n&&y<n;x+=d[0],y+=d[1]){const owner=occupied.get(key(x,y));if(owner!==undefined&&owner!==p.id){clear=false;break}}
   if(clear){left.delete(p.id);for(const c of p.cells)occupied.delete(key(...c));order.push(p.id);progress=true}
  }
  if(!progress)return null;
 }
 return order;
}
const TIERS=[
 {name:'Easy',min:25,max:40,color:'#357b62'},
 {name:'Medium',min:50,max:75,color:'#3779ad'},
 {name:'Hard',min:100,max:150,color:'#a47128'},
 {name:'Very Hard',min:150,max:200,color:'#c26542'},
 {name:'Nightmare',min:200,max:250,color:'#a44e85'},
 {name:'Extreme Nightmare',min:300,max:400,color:'#9551c5'}
];
function levelSpec(level,seed){
 // Tier shuffling is stable across devices. Later levels trend toward each
 // tier's upper bound, while seeded jitter varies count and spatial density.
 const tierIndex=hash('difficulty-v2-'+level)%TIERS.length,tier=TIERS[tierIndex],r=rng(seed^0x51f);
 const progress=Math.max(0,Math.min(1,(level-1)/149));
 const fraction=Math.max(0,Math.min(1,progress+(r()-.5)*.3));
 const count=tier.min+Math.round((tier.max-tier.min)*fraction);
 return{tierIndex,tier,count,spacing:1.05+r()*.35};
}
// Reverse placement, with exact piece counts rather than approximate coverage.
// If a board becomes too crowded, retry on a larger square; never show a
// smaller-than-requested puzzle. Deterministic roomy fallback guarantees space.
function generate(level,seed){
 const spec=levelSpec(level,seed),random=rng(seed);let n=Math.ceil(Math.sqrt(spec.count*(4+spec.tierIndex*.65))*spec.spacing);
 for(let pass=0;pass<4;pass++,n+=4){
  const occupied=new Set(),pieces=[];
  for(let attempt=0;attempt<n*n*35&&pieces.length<spec.count;attempt++){
   const x=Math.floor(random()*n),y=Math.floor(random()*n),dir=Math.floor(random()*4),d=dirs[dir];if(occupied.has(key(x,y)))continue;
   const ray=new Set();let clear=true;
   for(let a=x+d[0],b=y+d[1];a>=0&&b>=0&&a<n&&b<n;a+=d[0],b+=d[1]){ray.add(key(a,b));if(occupied.has(key(a,b))){clear=false;break}}
   if(!clear)continue;
   const cells=[[x,y]],local=new Set([key(x,y)]),length=2+Math.floor(random()*(4+spec.tierIndex));let cur=[x-d[0],y-d[1]];
   for(let j=1;j<length;j++){
    if(j>1){const options=dirs.map(v=>[cur[0]+v[0],cur[1]+v[1]]).filter(c=>c[0]>=0&&c[1]>=0&&c[0]<n&&c[1]<n&&!occupied.has(key(...c))&&!local.has(key(...c))&&!ray.has(key(...c)));if(!options.length)break;cur=options[Math.floor(random()*options.length)]}
    if(cur[0]<0||cur[1]<0||cur[0]>=n||cur[1]>=n||occupied.has(key(...cur))||local.has(key(...cur))||ray.has(key(...cur)))break;
    cells.unshift([...cur]);local.add(key(...cur));
   }
   if(cells.length<2)continue;
   for(const c of cells)occupied.add(key(...c));pieces.push({id:pieces.length,cells,dir,color:COLORS[pieces.length%COLORS.length],removed:false,slide:0,shake:0});
  }
  if(pieces.length===spec.count&&solve(pieces,n))return{n,pieces,...spec};
 }
 // All tails point down in separate vertical lanes. In bottom-to-top
 // placement order, every upward head ray is clear of earlier pieces.
 const pieces=[],cols=Math.ceil(Math.sqrt(spec.count));n=cols*3;
 for(let row=cols-1;row>=0&&pieces.length<spec.count;row--)for(let col=0;col<cols&&pieces.length<spec.count;col++){
  const x=col*3,y=row*3;pieces.push({id:pieces.length,cells:[[x,y+2],[x,y+1],[x,y]],dir:0,color:COLORS[pieces.length%COLORS.length],removed:false,slide:0,shake:0});
 }
 if(!solve(pieces,n))throw Error('Level validation failed');return{n,pieces,...spec};
}
function dailyDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function start(level=1,daily=false){const date=dailyDate(),data=generate(daily?1+hash(date)%TOTAL:level,hash(daily?'daily-'+date:'arrow-v1-'+level));game={...data,level,daily,date,hearts:3,hints:3,undos:3,history:[],status:'playing',hintId:null,hintUntil:0,total:data.pieces.length};particles=[];view={zoom:1,x:0,y:0};$('overlay').hidden=true;resize();ui()}
function ui(){const left=game.pieces.filter(p=>!p.removed&&!p.slide).length;$('levelTitle').textContent=game.daily?'Daily escape':'Level '+String(game.level).padStart(2,'0');$('chapter').textContent=game.tier.name.toUpperCase();$('chapter').style.color=game.tier.color;$('subtitle').textContent=(game.daily?game.date+' · ':'')+game.total+' arrows · '+game.n+' × '+game.n+' board';$('hearts').textContent='♥'.repeat(game.hearts)+'♡'.repeat(3-game.hearts);$('hearts').setAttribute('aria-label',game.hearts+' hearts');$('remaining').textContent=left+' / '+game.total+' ARROWS';$('progress').style.width=(100*(1-left/game.total))+'%';$('hintCount').textContent='/ '+game.hints;$('undoCount').textContent='/ '+game.undos;$('undo').disabled=!game.history.length||!game.undos;$('hint').disabled=!game.hints||game.status!=='playing'||!left;$('boardLabel').textContent=game.n>6?'PINCH TO ZOOM · DRAG TO EXPLORE':'TAP AN ARROW TO LET IT GO'}
// Synthesized audio, unlocked only by a user gesture.
let audio;function sound(type){if(!saved.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=type==='win'?[523,659,784,1047]:type==='error'?[105,80]:type==='whoosh'?[650,320,160]:[480];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.08;o.type=type==='error'?'triangle':'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.65,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.24)})}catch{}}
function vibrate(pattern){if(!saved.haptics)return;if(navigator.vibrate)navigator.vibrate(pattern);else if(window.webkit?.messageHandlers?.haptics)window.webkit.messageHandlers.haptics.postMessage(pattern.length>2?'error':'success')}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
// Escapes reserve their removal immediately; animation never locks input.
function tap(piece){if(!piece||piece.removed||piece.slide||game.status!=='playing'||!$('overlay').hidden)return;sound('tap');game.hintId=null;if(!free(piece,game.pieces,game.n)){game.history.push({type:'block',id:piece.id,hearts:game.hearts});game.hearts--;piece.shake=.42;sound('error');vibrate([45,25,45]);if(!game.hearts){game.status='failed';const failedGame=game;setTimeout(()=>{if(game===failedGame&&game.status==='failed')result(false)},480)}else toast('That way is blocked. Try another arrow.');ui();return}game.history.push({type:'escape',id:piece.id,hearts:game.hearts});piece.slide=.001;sound('whoosh');ui()}
function undo(){if(!game.undos||!game.history.length)return;const move=game.history.pop(),p=game.pieces.find(p=>p.id===move.id);p.removed=false;p.slide=0;p.shake=0;game.hearts=move.hearts;game.undos--;game.status='playing';game.hintId=null;$('overlay').hidden=true;ui();sound('tap')}
function hint(){if(game.status!=='playing'||!game.hints)return;const p=game.pieces.find(p=>!p.removed&&!p.slide&&free(p,game.pieces,game.n));if(p){game.hints--;game.hintId=p.id;game.hintUntil=performance.now()+6000;view.zoom=Math.max(view.zoom,Math.min(14,24/cell));const h=screen(p.cells.at(-1));view.x=-(h[0]-W/2)*view.zoom;view.y=-(h[1]-H/2)*view.zoom;clampPan();toast('The glowing arrow has a clear way out.');sound('tap');ui()}}
function modal(html){$('card').innerHTML=html;$('overlay').hidden=false}
function result(win){if(win){const k=game.daily?game.date:game.level,store=game.daily?saved.daily:saved.stars;store[k]=Math.max(store[k]||0,game.hearts);if(!game.daily)saved.unlocked=Math.max(saved.unlocked,Math.min(TOTAL,game.level+1));persist();sound('win');vibrate([45,60,90]);for(let i=0;i<90;i++)particles.push({x:Math.random()*W,y:-Math.random()*H,vx:(Math.random()-.5)*180,vy:80+Math.random()*160,life:3,max:3,color:COLORS[i%7],confetti:true})}
modal('<span class="eyebrow">'+(win?'BEAUTIFULLY UNTANGLED':'TAKE A BREATH')+'</span><h2>'+(win?'Room to move.':'A fresh perspective?')+'</h2><div class="stars">'+(win?'★'.repeat(game.hearts)+'☆'.repeat(3-game.hearts):'♡ ♡ ♡')+'</div><p>'+(win?'Every arrow found its way. So did you.':'You ran out of hearts. Restart the puzzle or undo your last move.')+'</p><button class="primary" id="resultPrimary">'+(win?(game.daily?'Back to levels':game.level===TOTAL?'Play again':'Next level →'):'Try again')+'</button>'+(!win&&game.undos&&game.history.length?'<button class="secondary" id="resultUndo">Undo last move ('+game.undos+' left)</button>':'')+'<button class="secondary" id="resultLevels">Choose a level</button>');$('resultPrimary').onclick=()=>win?(game.daily?levels():start(game.level===TOTAL?1:game.level+1)):start(game.level,game.daily);if($('resultUndo'))$('resultUndo').onclick=undo;$('resultLevels').onclick=levels}
function settings(){modal('<span class="eyebrow">MAKE YOURSELF AT HOME</span><h2>Settings</h2>'+['sound','haptics','theme','colors'].map(k=>'<div class="row"><span>'+k[0].toUpperCase()+k.slice(1)+'</span><button id="set-'+k+'">'+(k==='theme'?saved[k]:(saved[k]?'On':'Off'))+'</button></div>').join('')+'<p style="margin-top:20px">Tap an arrow to send it forward. Its head needs a clear line to the edge. Clear the board with as many hearts as you can.</p><button class="primary" id="closeSettings">Back to puzzle</button>');for(const k of ['sound','haptics','theme','colors'])$('set-'+k).onclick=()=>{saved[k]=k==='theme'?(saved[k]==='dark'?'light':'dark'):!saved[k];persist();theme();settings()};$('closeSettings').onclick=()=>$('overlay').hidden=true}
function levels(){modal('<span class="eyebrow">1,000 MOMENTS OF CLARITY</span><h2>Choose your escape</h2><p>Earn stars. Find a little more space.</p><button class="secondary" id="levelDaily">◷ Daily challenge · '+dailyDate()+'</button><div class="levels">'+Array.from({length:TOTAL},(_,i)=>{const l=i+1;return'<button class="level" data-level="'+l+'" '+(l>saved.unlocked?'disabled':'')+' aria-label="Level '+l+'">'+(l>saved.unlocked?'⌑':l)+'<small>'+(l<=saved.unlocked?TIERS[hash('difficulty-v2-'+l)%6].name:'')+'<br>'+'★'.repeat(saved.stars[l]||0)+'</small></button>'}).join('')+'</div><button class="primary" id="closeLevels">Back to puzzle</button>');$('card').querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));$('levelDaily').onclick=()=>start(75,true);$('closeLevels').onclick=()=>$('overlay').hidden=true}
// Renderer: path sampling makes every body segment follow the original bends.
function resize(){const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;const dpr=Math.min(3,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(game){cell=Math.min((W-38)/game.n,(H-58)/game.n);baseX=(W-cell*game.n)/2;baseY=(H-cell*game.n)/2-7}}new ResizeObserver(resize).observe(canvas);
function pointAt(p,t){const count=p.cells.length-1;if(t>=count){const h=p.cells[count],d=dirs[p.dir];return[h[0]+d[0]*(t-count),h[1]+d[1]*(t-count)]}const i=Math.max(0,Math.floor(t)),f=t-i,a=p.cells[i],b=p.cells[Math.min(i+1,count)];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
function screen(c){return[baseX+(c[0]+.5)*cell,baseY+(c[1]+.5)*cell]}
function frame(now){const dt=Math.min(.04,(now-lastTime)/1000||.016);lastTime=now;ctx.clearRect(0,0,W,H);if(game){ctx.save();ctx.translate(W/2+view.x,H/2+view.y);ctx.scale(view.zoom,view.zoom);ctx.translate(-W/2,-H/2);ctx.fillStyle=saved.theme==='dark'?'#344154':'#dbe1d6';if(saved.colors)for(let y=0;y<game.n;y++)for(let x=0;x<game.n;x++){const s=screen([x,y]);ctx.beginPath();ctx.arc(...s,1.5,0,Math.PI*2);ctx.fill()}
let finished=false;for(const p of game.pieces){if(p.removed)continue;if(p.shake>0)p.shake=Math.max(0,p.shake-dt);if(p.slide>0){p.slide+=dt*(12+game.n*1.1);if(p.slide>game.n+p.cells.length+2){p.removed=true;p.slide=0;finished=true;continue}const h=screen(pointAt(p,p.cells.length-1+p.slide));for(let j=0;j<1&&particles.length<300;j++)particles.push({x:(h[0]-W/2)*view.zoom+W/2+view.x,y:(h[1]-H/2)*view.zoom+H/2+view.y,vx:(Math.random()-.5)*45,vy:(Math.random()-.5)*45,life:.45,max:.45,color:p.color})}
ctx.save();if(p.shake)ctx.translate(Math.sin(p.shake*90)*cell*.12,0);const highlight=p.id===game.hintId&&now<game.hintUntil;ctx.strokeStyle=p.shake?'#ff627c':highlight?'#63bfa3':saved.colors?p.color:(saved.theme==='light'?'#26333b':'#e4eaf1');ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=saved.colors?Math.max(.9,cell*.16):Math.max(.7,cell*.085);ctx.lineCap='round';ctx.lineJoin='round';if(highlight){ctx.shadowColor='#63bfa3';ctx.shadowBlur=15+Math.sin(now/120)*5;ctx.lineWidth*=1.25}const end=p.cells.length-1+p.slide;ctx.beginPath();const tail=screen(pointAt(p,p.slide));ctx.moveTo(...tail);for(let t=Math.floor(p.slide)+1;t<end;t++)ctx.lineTo(...screen(pointAt(p,t)));const head=screen(pointAt(p,end));ctx.lineTo(...head);ctx.stroke();const d=dirs[p.dir],size=cell*(saved.colors?.21:.18);ctx.beginPath();ctx.moveTo(head[0]-d[0]*size-d[1]*size,head[1]-d[1]*size+d[0]*size);ctx.lineTo(...head);ctx.lineTo(head[0]-d[0]*size+d[1]*size,head[1]-d[1]*size-d[0]*size);ctx.stroke();ctx.restore()}ctx.restore();if(finished){ui();if(game.status==='playing'&&game.pieces.every(q=>q.removed)){game.status='won';result(true)}}}
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.confetti)p.vy+=80*dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.confetti?5:3,p.confetti?9:3)}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(frame)}
// Input: forgiving nearest-path selection; pointer gestures separate taps/pans.
const pointers=new Map();let gesture=null;
function distanceToSegment(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hit(x,y){if(cell*view.zoom<13){toast('Zoom in with + or pinch to select an arrow.');return;}const p=[(x-W/2-view.x)/view.zoom+W/2,(y-H/2-view.y)/view.zoom+H/2];let best=null,dist=Infinity;for(const a of game.pieces)if(!a.removed&&!a.slide)for(let i=1;i<a.cells.length;i++){const d=distanceToSegment(p,screen(a.cells[i-1]),screen(a.cells[i]));if(d<dist){dist=d;best=a}}if(dist<=Math.max(cell*.37,12/view.zoom))tap(best)}
function coords(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function pinchData(){const [a,b]=[...pointers.values()];return{distance:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function clampPan(){view.x=Math.max(-W*(view.zoom-1)/2-30,Math.min(W*(view.zoom-1)/2+30,view.x));view.y=Math.max(-H*(view.zoom-1)/2-30,Math.min(H*(view.zoom-1)/2+30,view.y));if(view.zoom===1)view.x=view.y=0}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,coords(e));if(pointers.size===1)gesture={...coords(e),last:coords(e),moved:false,multi:false};if(pointers.size===2){gesture.multi=true;gesture.pinch=pinchData();gesture.zoom=view.zoom;gesture.vx=view.x;gesture.vy=view.y}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;const p=coords(e);pointers.set(e.pointerId,p);if(pointers.size===2){const q=pinchData(),g=gesture.pinch;if(!g)return;view.zoom=Math.max(1,Math.min(14,gesture.zoom*q.distance/Math.max(1,g.distance)));const ratio=view.zoom/gesture.zoom;view.x=q.x-W/2-(g.x-W/2-gesture.vx)*ratio;view.y=q.y-H/2-(g.y-H/2-gesture.vy)*ratio;clampPan()}else{if(Math.hypot(p.x-gesture.x,p.y-gesture.y)>8)gesture.moved=true;if(gesture.moved&&view.zoom>1){view.x+=p.x-gesture.last.x;view.y+=p.y-gesture.last.y;clampPan()}gesture.last=p}});
function endPointer(e,cancel=false){if(!pointers.has(e.pointerId))return;const p=coords(e);pointers.delete(e.pointerId);if(!cancel&&gesture&&!gesture.moved&&!gesture.multi&&pointers.size===0)hit(p.x,p.y);if(!pointers.size)gesture=null;else if(gesture)gesture.last=[...pointers.values()][0]}
canvas.addEventListener('pointerup',e=>endPointer(e));canvas.addEventListener('pointercancel',e=>endPointer(e,true));canvas.addEventListener('wheel',e=>{e.preventDefault();view.zoom=Math.max(1,Math.min(14,view.zoom-e.deltaY*.003));clampPan()},{passive:false});
$('zoomIn').onclick=()=>{view.zoom=Math.min(14,Math.max(view.zoom*1.5,18/cell));clampPan()};$('zoomOut').onclick=()=>{view.zoom=Math.max(1,view.zoom/1.5);clampPan()};$('zoomFit').onclick=()=>{view={zoom:1,x:0,y:0}};$('hint').onclick=hint;$('undo').onclick=undo;$('restart').onclick=()=>{modal('<h2>A clean slate?</h2><p>Restart this puzzle with three hearts. Your hints and undos will reset.</p><button class="primary" id="confirmRestart">Restart level</button><button class="secondary" id="cancelRestart">Keep playing</button>');$('confirmRestart').onclick=()=>start(game.level,game.daily);$('cancelRestart').onclick=()=>$('overlay').hidden=true};$('settings').onclick=settings;$('select').onclick=levels;$('daily').onclick=()=>start(75,true);
// Exposed read-only helpers enable exhaustive generator validation without assets.
window.ArrowEscape={generate,solve,free,levelSpec,TIERS,get state(){return game},start};start(Math.min(TOTAL,saved.unlocked));requestAnimationFrame(frame);
</script></body></html>
