const TIERS=[
 {name:'Easy',min:25,max:40,color:'#357b62'},
 {name:'Medium',min:50,max:75,color:'#3779ad'},
 {name:'Hard',min:100,max:150,color:'#a47128'},

 // tier's upper bound, while seeded jitter varies count and spatial density.

// Dense reverse construction. Partition a portrait rectangle into row bands,
// then tile each band with connected snakes. Every cell belongs to a piece.
// Visit each band from its far edge toward its escape edge, so a horizontal

  const count=Math.ceil(remaining/(rows-row)),h=2+Math.floor(random()*3);

function modal(html){$('card').innerHTML=html;$('overlay').hidden=false}
function result(win){if(win){const k=game.daily?game.date:game.level,store=game.daily?saved.daily:saved.stars;store[k]=Math.max(store[k]||0,game.hearts);if(!game.daily)saved.unlocked=Math.max(saved.unlocked,Math.min(TOTAL,game.level+1));persist();sound('win');vibrate([45,60,90]);for(let i=0;i<90;i++)particles.push({x:Math.random()*W,y:-Math.random()*H,vx:(Math.random()-.5)*180,vy:80+Math.random()*160,life:3,max:3,color:COLORS[i%7],confetti:true})}
modal('<span class="eyebrow">'+(win?'BEAUTIFULLY UNTANGLED':'TAKE A BREATH')+'</span><h2>'+(win?'Room to move.':'A fresh perspective?')+'</h2><div class="stars">'+(win?'★'.repeat(game.hearts)+'☆'.repeat(3-game.hearts):'♡ ♡ ♡')+'</div><p>'+(win?'Every arrow found its way. So did you.':'You ran out of hearts. Restart the puzzle or undo your last move.')+'</p><button class="primary" id="resultPrimary">'+(win?(game.daily?'Back to levels':game.level===TOTAL?'Play again':'Next level →'):'Try again')+'</button>'+(!win&&game.undos&&game.history.length?'<button class="secondary" id="resultUndo">Undo last move ('+game.undos+' left)</button>':'')+'<button class="secondary" id="resultLevels">Choose a level</button>');$('resultPrimary').onclick=()=>win?(game.daily?levels():start(game.level===TOTAL?1:game.level+1)):start(game.level,game.daily);if($('resultUndo'))$('resultUndo').onclick=undo;$('resultLevels').onclick=levels}
function settings(){modal('<span class="eyebrow">MAKE YOURSELF AT HOME</span><h2>Settings</h2>'+['sound','haptics','theme','colors'].map(k=>'<div class="row"><span>'+k[0].toUpperCase()+k.slice(1)+'</span><button id="set-'+k+'">'+(k==='theme'?saved[k]:(saved[k]?'On':'Off'))+'</button></div>').join('')+'<p style="margin-top:20px">Tap an arrow to send it forward. Its head needs a clear line to the edge. Clear the board with as many hearts as you can.</p><button class="primary" id="closeSettings">Back to puzzle</button>');for(const k of ['sound','haptics','theme','colors'])$('set-'+k).onclick=()=>{saved[k]=k==='theme'?(saved[k]==='dark'?'light':'dark'):!saved[k];persist();theme();settings()};$('closeSettings').onclick=()=>$('overlay').hidden=true}
function levels(){modal('<span class="eyebrow">1,000 MOMENTS OF CLARITY</span><h2>Choose your escape</h2><p>Earn stars. Find a little more space.</p><button class="secondary" id="levelDaily">◷ Daily challenge · '+dailyDate()+'</button><div class="levels">'+Array.from({length:TOTAL},(_,i)=>{const l=i+1;return'<button class="level" data-level="'+l+'" '+(l>saved.unlocked?'disabled':'')+' aria-label="Level '+l+'">'+(l>saved.unlocked?'⌑':l)+'<small>'+(l<=saved.unlocked?TIERS[hash('difficulty-v2-'+l)%6].name:'')+'<br>'+'★'.repeat(saved.stars[l]||0)+'</small></button>'}).join('')+'</div><button class="primary" id="closeLevels">Back to puzzle</button>');$('card').querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));$('levelDaily').onclick=()=>start(75,true);$('closeLevels').onclick=()=>$('overlay').hidden=true}
// Renderer: path sampling makes every body segment follow the original bends.
// Fit the original occupied bounds; zoom controls live outside the canvas. Do not refit as pieces leave: the board must remain stable to tap.
function puzzleBounds(){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const p of game.pieces)for(const [x,y] of p.cells){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}return{minX,minY,width:maxX-minX+1,height:maxY-minY+1}}
function resize(){const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;const dpr=Math.min(3,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(game){const bounds=puzzleBounds(),availableH=Math.max(40,H-16);cell=Math.min((W-24)/bounds.width,availableH/bounds.height);baseX=(W-cell*bounds.width)/2-bounds.minX*cell;baseY=(availableH-cell*bounds.height)/2-bounds.minY*cell+8;clampPan()}}
new ResizeObserver(resize).observe(canvas);
function pointAt(p,t){const count=p.cells.length-1;if(t>=count){const h=p.cells[count],d=dirs[p.dir];return[h[0]+d[0]*(t-count),h[1]+d[1]*(t-count)]}const i=Math.max(0,Math.floor(t)),f=t-i,a=p.cells[i],b=p.cells[Math.min(i+1,count)];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
// Keep arrowheads readable in overview and proportional when zoomed in.
function arrowHeadSize(){return Math.max(cell*.5,8/view.zoom)}
function screen(c){return[baseX+(c[0]+.5)*cell,baseY+(c[1]+.5)*cell]}
// The optional guide layer uses the actual occupied rectangle, never the
// larger solver grid. Cache geometry; zoom and pan share the canvas transform.
function drawPathGuides(){
 if(!game.showPaths)return;
 const cacheKey=[W,H,cell,baseX,baseY].join(',');
 if(!game.guideCache||game.guideCache.key!==cacheKey){
  const bounds=puzzleBounds(),grid=new Path2D(),rays=new Path2D(),r=Math.max(.5,cell*.055);
  for(let y=bounds.minY;y<bounds.minY+bounds.height;y++)for(let x=bounds.minX;x<bounds.minX+bounds.width;x++){
   const p=screen([x,y]);grid.moveTo(p[0]+r,p[1]);grid.arc(p[0],p[1],r,0,Math.PI*2);
  }
  for(const p of game.pieces)if(!p.removed&&!p.slide){
   const head=p.cells.at(-1),d=dirs[p.dir],end=[...head];
   if(d[0])end[0]=d[0]>0?bounds.minX+bounds.width-.5:bounds.minX-.5;
   if(d[1])end[1]=d[1]>0?bounds.minY+bounds.height-.5:bounds.minY-.5;
   rays.moveTo(...screen(head));rays.lineTo(...screen(end));
  }
  game.guideCache={key:cacheKey,grid,rays};
 }
 ctx.save();ctx.fillStyle=saved.theme==='light'?'#a5accd':'#70829e';ctx.globalAlpha=.5;ctx.fill(game.guideCache.grid);
 ctx.strokeStyle=saved.theme==='light'?'#7f89bb':'#a1b6db';ctx.globalAlpha=.35;ctx.lineWidth=1/view.zoom;ctx.setLineDash([2/view.zoom,4/view.zoom]);ctx.stroke(game.guideCache.rays);ctx.restore();
}
function frame(now){const dt=Math.min(.04,(now-lastTime)/1000||.016);lastTime=now;ctx.clearRect(0,0,W,H);if(game){ctx.save();ctx.translate(W/2+view.x,H/2+view.y);ctx.scale(view.zoom,view.zoom);ctx.translate(-W/2,-H/2);drawPathGuides();ctx.fillStyle=saved.theme==='dark'?'#344154':'#dbe1d6';
const heads=[];let finished=false;for(const p of game.pieces){if(p.removed)continue;if(p.shake>0)p.shake=Math.max(0,p.shake-dt);if(p.slide>0){p.slide+=dt*(12+game.n*1.1);if(p.slide>game.n+p.cells.length+2){p.removed=true;p.slide=0;finished=true;continue}const h=screen(pointAt(p,p.cells.length-1+p.slide));for(let j=0;j<1&&particles.length<300;j++)particles.push({x:(h[0]-W/2)*view.zoom+W/2+view.x,y:(h[1]-H/2)*view.zoom+H/2+view.y,vx:(Math.random()-.5)*45,vy:(Math.random()-.5)*45,life:.45,max:.45,color:p.color})}
ctx.save();if(p.shake)ctx.translate(Math.sin(p.shake*90)*cell*.12,0);const highlight=p.id===game.hintId&&now<game.hintUntil;ctx.strokeStyle=p.shake?'#ff627c':highlight?'#63bfa3':saved.colors?p.color:(saved.theme==='light'?'#10112d':'#e4eaf1');ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=saved.colors?Math.max(.9,cell*.16):Math.max(.7,cell*.085);ctx.lineCap='round';ctx.lineJoin='round';if(highlight){ctx.shadowColor='#63bfa3';ctx.shadowBlur=15+Math.sin(now/120)*5;ctx.lineWidth*=1.25}const end=p.cells.length-1+p.slide;ctx.beginPath();const tail=screen(pointAt(p,p.slide));ctx.moveTo(...tail);for(let t=Math.floor(p.slide)+1;t<end;t++)ctx.lineTo(...screen(pointAt(p,t)));const head=screen(pointAt(p,end));ctx.lineTo(...head);ctx.stroke();heads.push({head:[head[0]+(p.shake?Math.sin(p.shake*90)*cell*.12:0),head[1]],dir:p.dir,size:arrowHeadSize(),color:ctx.fillStyle});ctx.restore()}
// Heads go last so neighboring bodies cannot paint over their tips.
for(const arrow of heads){const d=dirs[arrow.dir],head=arrow.head,size=arrow.size;ctx.fillStyle=arrow.color;ctx.beginPath();ctx.moveTo(head[0]-d[0]*size-d[1]*size*.75,head[1]-d[1]*size+d[0]*size*.75);ctx.lineTo(head[0]+d[0]*size*.35,head[1]+d[1]*size*.35);ctx.lineTo(head[0]-d[0]*size+d[1]*size*.75,head[1]-d[1]*size-d[0]*size*.75);ctx.closePath();ctx.fill()}
ctx.restore();if(finished){ui();if(game.status==='playing'&&game.pieces.every(q=>q.removed)){game.status='won';result(true)}}}
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.confetti)p.vy+=80*dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.confetti?5:3,p.confetti?9:3)}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(frame)}
// Input: forgiving nearest-path selection; pointer gestures separate taps/pans.
// Suppress selection, image dragging and long-press menus inside the game.
for(const event of ['selectstart','dragstart','contextmenu'])document.querySelector('.app').addEventListener(event,e=>e.preventDefault());
const pointers=new Map();let gesture=null;
function distanceToSegment(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hit(x,y){if(cell*view.zoom<13){toast('Zoom in with + or pinch to select an arrow.');return;}const p=[(x-W/2-view.x)/view.zoom+W/2,(y-H/2-view.y)/view.zoom+H/2];let best=null,dist=Infinity;for(const a of game.pieces)if(!a.removed&&!a.slide)for(let i=1;i<a.cells.length;i++){const d=distanceToSegment(p,screen(a.cells[i-1]),screen(a.cells[i]));if(d<dist){dist=d;best=a}}if(dist<=Math.max(cell*.42,14/view.zoom))tap(best)}
function coords(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function pinchData(){const [a,b]=[...pointers.values()];return{distance:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function clampPan(){view.x=Math.max(-W*(view.zoom-1)/2-30,Math.min(W*(view.zoom-1)/2+30,view.x));view.y=Math.max(-H*(view.zoom-1)/2-30,Math.min(H*(view.zoom-1)/2+30,view.y));if(view.zoom===1)view.x=view.y=0}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,coords(e));if(pointers.size===1)gesture={...coords(e),last:coords(e),moved:false,multi:false};if(pointers.size===2){gesture.multi=true;gesture.pinch=pinchData();gesture.zoom=view.zoom;gesture.vx=view.x;gesture.vy=view.y}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;const p=coords(e);pointers.set(e.pointerId,p);if(pointers.size===2){const q=pinchData(),g=gesture.pinch;if(!g)return;view.zoom=Math.max(1,Math.min(14,gesture.zoom*q.distance/Math.max(1,g.distance)));const ratio=view.zoom/gesture.zoom;view.x=q.x-W/2-(g.x-W/2-gesture.vx)*ratio;view.y=q.y-H/2-(g.y-H/2-gesture.vy)*ratio;clampPan()}else{if(Math.hypot(p.x-gesture.x,p.y-gesture.y)>8)gesture.moved=true;if(gesture.moved&&view.zoom>1){view.x+=p.x-gesture.last.x;view.y+=p.y-gesture.last.y;clampPan()}gesture.last=p}});
function endPointer(e,cancel=false){if(!pointers.has(e.pointerId))return;const p=coords(e);pointers.delete(e.pointerId);if(!cancel&&gesture&&!gesture.moved&&!gesture.multi&&pointers.size===0)hit(p.x,p.y);if(!pointers.size)gesture=null;else if(gesture)gesture.last=[...pointers.values()][0]}
canvas.addEventListener('pointerup',e=>endPointer(e));canvas.addEventListener('pointercancel',e=>endPointer(e,true));canvas.addEventListener('wheel',e=>{e.preventDefault();view.zoom=Math.max(1,Math.min(14,view.zoom-e.deltaY*.003));clampPan()},{passive:false});
$('paths').onclick=()=>{game.showPaths=!game.showPaths;game.guideCache=null;ui()};$('zoomIn').onclick=()=>{view.zoom=Math.min(14,Math.max(view.zoom*1.5,18/cell));clampPan()};$('zoomOut').onclick=()=>{view.zoom=Math.max(1,view.zoom/1.5);clampPan()};$('zoomFit').onclick=()=>{view={zoom:1,x:0,y:0}};$('hint').onclick=hint;$('undo').onclick=undo;$('restart').onclick=()=>{modal('<h2>A clean slate?</h2><p>Restart this puzzle with three hearts. Your hints and undos will reset.</p><button class="primary" id="confirmRestart">Restart level</button><button class="secondary" id="cancelRestart">Keep playing</button>');$('confirmRestart').onclick=()=>start(game.level,game.daily);$('cancelRestart').onclick=()=>$('overlay').hidden=true};$('settings').onclick=settings;$('select').onclick=levels;$('daily').onclick=()=>start(75,true);
// Exposed read-only helpers enable exhaustive generator validation without assets.
window.ArrowEscape={generate,solve,free,levelSpec,TIERS,get state(){return game},start};start(Math.min(TOTAL,saved.unlocked));requestAnimationFrame(frame);
</script></body></html>
